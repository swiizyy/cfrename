# Example configuration for cfrename
# Copy this file to ~/.config/cfrename/config.toml and customize it

# Date input formats (optional)
# Defines the formats accepted when entering dates interactively
# The first format is used as the default display format
# Note: Output filenames will ALWAYS use YYYY-MM-DD format regardless of input
date_formats = [
    "%Y-%m-%d",    # YYYY-MM-DD (ISO format)
    "%d/%m/%Y",    # DD/MM/YYYY (European format)
    "%d-%m-%Y",    # DD-MM-YYYY
]

# ============================================================================
# ADMINISTRATIVE CATEGORY
# ============================================================================

[categories.administrative]
name = "Administrative"
target_directory = "~/Documents/Administrative"

# Tax documents
[categories.administrative.types.tax]
name = "Tax"
descriptions = ["Notice", "Declaration", "Receipt"]
require_entity = false

# Bank documents
[categories.administrative.types.bank]
name = "Bank"
descriptions = ["Statement", "IBAN", "Contract"]
require_entity = true
entities = ["BNP", "Credit Agricole", "Societe Generale"]

# Insurance documents
[categories.administrative.types.insurance]
name = "Insurance"
descriptions = ["Policy", "Claim", "Certificate"]
require_entity = true
entities = ["AXA", "Allianz", "Generali"]

# Utilities
[categories.administrative.types.utilities]
name = "Utilities"
descriptions = ["Bill", "Contract", "Statement"]
require_entity = true
entities = ["Electricity", "Water", "Gas", "Internet"]

# ============================================================================
# PROFESSIONAL CATEGORY
# ============================================================================

[categories.professional]
name = "Professional"
target_directory = "~/Documents/Professional"

# Work documents
[categories.professional.types.work]
name = "Work"
