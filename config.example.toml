require_entity = true
entities = ["ACME", "TechCorp", "GlobalServices"]

# Training documents
[categories.professional.types.training]
name = "Training"
descriptions = ["Certificate", "Diploma", "Program"]
require_entity = false

# Business documents
[categories.professional.types.business]
name = "Business"
descriptions = ["Invoice", "Quote", "Purchase Order"]
require_entity = true
entities = ["Client A", "Client B", "Client C"]

