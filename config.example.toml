require_entity = false

# ============================================================================
# PERSONAL CATEGORY
# ============================================================================

[categories.personal]
name = "Personal"
# Relative path (combined with base_path)
target_directory = "Personal"

# ID documents
[categories.personal.types.id]
name = "ID"
descriptions = ["Passport", "ID Card", "Driver License", "Birth Certificate"]
