[package]
name = "cfrename"
version = "0.1.0"
edition = "2021"
authors = ["xmac"]
description = "CLI tool for standardizing file renaming and organization"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
dialoguer = "0.11"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
chrono = "0.4"
anyhow = "1.0"
directories = "5.0"
shellexpand = "3.1"
